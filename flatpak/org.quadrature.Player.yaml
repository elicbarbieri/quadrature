# Release manifest — sources pinned to a git revision for reproducibility.
# Used by CI (.github/workflows/flatpak.yml) and for Flathub submission.
# For local iteration against your working tree, use flatpak/dev.yaml.

id: org.quadrature.Player
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: quadrature

rename-icon: quadrature
rename-desktop-file: org.quadrature.player.desktop
rename-appdata-file: org.quadrature.player.metainfo.xml

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --filesystem=xdg-run/pipewire-0
  - --system-talk-name=org.freedesktop.RealtimeKit1
  - --filesystem=xdg-music:ro

build-options:
  env:
    PKG_CONFIG_PATH: /app/lib/pkgconfig:/usr/lib/pkgconfig

cleanup:
  - /include
  - /share/man
  - /share/aclocal
  - /share/doc
  - /share/gtk-doc
  - /share/info
  - '*.la'
  - '*.a'

modules:
  # FFmpeg bundled (not via the ffmpeg-full extension — not built for fd 25.08).
  # GPL allowed for downstream apps; nonfree off to stay redistributable.
  - name: ffmpeg
    config-opts:
      - --prefix=/app
      - --enable-shared
      - --disable-static
      - --enable-gpl
      - --disable-programs
      - --disable-doc
      - --disable-htmlpages
      - --disable-manpages
      - --disable-podpages
      - --disable-txtpages
      - --disable-debug
      - --disable-avdevice
      - --disable-network
    cleanup:
      - /share/ffmpeg
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-8.1.tar.xz
        sha256: b072aed6871998cce9b36e7774033105ca29e33632be5b6347f3206898e0756a

  # No SIMD enables: x86-only flags break aarch64 configure. Nix tunes per-host.
  - name: fftw3-double
    buildsystem: autotools
    config-opts:
      - --enable-shared
      - --disable-static
      - --enable-threads
    sources:
      - type: archive
        url: https://www.fftw.org/fftw-3.3.10.tar.gz
        mirror-urls:
          - https://distfiles.macports.org/fftw-3/fftw-3.3.10.tar.gz
        sha256: 56c932549852cddcfafdab3820b0200c7742675be92179e59e6215b340e26467

  - name: libvips
    buildsystem: meson
    config-opts:
      - --buildtype=release
      - -Dintrospection=disabled
      - -Dvapi=false
      - -Dmodules=disabled
      - -Ddeprecated=false
      - -Dexamples=false
    sources:
      - type: archive
        url: https://github.com/libvips/libvips/releases/download/v8.18.0/vips-8.18.0.tar.xz
        sha256: b85ab92280c30d22f5c8fe2f68b809cddb7eaac437d8c33474475dac84ddc574

  - name: rubberband
    buildsystem: meson
    config-opts:
      - --buildtype=release
      - -Ddefault_library=shared
      - -Dfft=builtin
      - -Dresampler=builtin
      - -Dcmdline=disabled
    sources:
      - type: archive
        url: https://breakfastquay.com/files/releases/rubberband-4.0.0.tar.bz2
        sha256: af050313ee63bc18b35b2e064e5dce05b276aaf6d1aa2b8a82ced1fe2f8028e9

  - name: chromaprint
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TOOLS=OFF
      - -DBUILD_TESTS=OFF
      - -DFFT_LIB=fftw3
    sources:
      - type: archive
        url: https://github.com/acoustid/chromaprint/releases/download/v1.6.0/chromaprint-1.6.0.tar.gz
        sha256: 9d33482e56a1389a37a0d6742c376139fa43e3b8a63d29003222b93db2cb40da

  - name: taglib
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DWITH_ZLIB=ON
    sources:
      - type: archive
        url: https://github.com/taglib/taglib/releases/download/v2.1.1/taglib-2.1.1.tar.gz
        sha256: 3716d31f7c83cbf17b67c8cf44dd82b2a2f17e6780472287a16823e70305ddba

  - name: quadrature
    buildsystem: simple
    build-commands:
      - cmake --preset=flatpak -DCMAKE_INSTALL_PREFIX=/app
      - cmake --build --preset=flatpak
      - cmake --install build/flatpak
    sources:
      - type: git
        url: https://github.com/elicbarbieri/quadrature.git
        tag: v0.1.0
