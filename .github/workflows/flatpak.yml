name: Flatpak Bundle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
    steps:
      - uses: actions/checkout@v4
      - run: flatpak-builder-lint manifest flatpak/org.quadrature.Player.yaml

  build:
    name: Build (${{ matrix.arch }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-24.04     }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - id: ver
        # github.ref / github.ref_name / github.sha through env: per
        # https://github.blog/security/.../github-actions-workflow-injections
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.5
        with:
          bundle: quadrature-${{ steps.ver.outputs.version }}-${{ matrix.arch }}.flatpak
          manifest-path: flatpak/org.quadrature.Player.yaml
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('flatpak/org.quadrature.Player.yaml') }}
          arch: ${{ matrix.arch }}
          run-tests: false

      # x86_64 only — ARM flatpak runs aren't supported inside this container.
      - name: Smoke test bundle
        if: matrix.arch == 'x86_64'
        env:
          BUNDLE: quadrature-${{ steps.ver.outputs.version }}-${{ matrix.arch }}.flatpak
        shell: bash
        run: |
          set -euo pipefail
          flatpak install --user --noninteractive --assumeyes "./$BUNDLE"
          flatpak run --user org.quadrature.Player --help
          flatpak uninstall --user --noninteractive --assumeyes org.quadrature.Player

  release:
    name: Attach bundles to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Versionless aliases so README's /latest/download/ links work.
      - name: Create latest aliases
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          for f in quadrature-*-x86_64.flatpak;  do [ -f "$f" ] && cp "$f" quadrature-x86_64.flatpak;  done
          for f in quadrature-*-aarch64.flatpak; do [ -f "$f" ] && cp "$f" quadrature-aarch64.flatpak; done

      - uses: softprops/action-gh-release@v2.1.0
        with:
          files: artifacts/*.flatpak
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
